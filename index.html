<!DOCTYPE html>
<html lang="bn" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>বিশ্ব মানচিত্র অভিযাত্রী | Interactive Terrain, Ocean & World Explorer</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts for Bengali & English Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Hind Siliguri', 'Inter', 'sans-serif'],
                    },
                    colors: {
                        ocean: {
                            500: '#0284c7',
                            600: '#0369a1',
                            900: '#0c4a6e',
                        },
                        mountain: {
                            500: '#d97706',
                            600: '#b45309',
                            800: '#78350f',
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body, html {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: 'Hind Siliguri', sans-serif;
            overflow: hidden;
            background-color: #030712;
        }

        #map {
            height: 100vh;
            width: 100vw;
            z-index: 1;
            background: #0284c7;
        }

        /* Custom Scrollbars */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.6);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(56, 189, 248, 0.4);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(56, 189, 248, 0.8);
        }

        /* Leaflet Controls & Popups */
        .leaflet-container {
            font-family: 'Hind Siliguri', sans-serif !important;
            background: #082f49;
        }
        .leaflet-popup-content-wrapper {
            background: rgba(15, 23, 42, 0.96) !important;
            color: #f8fafc !important;
            backdrop-filter: blur(14px);
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 20px !important;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7) !important;
            padding: 0 !important;
            overflow: hidden;
        }
        .leaflet-popup-content {
            margin: 0 !important;
            line-height: 1.5;
        }
        .leaflet-popup-tip {
            background: rgba(15, 23, 42, 0.96) !important;
        }
        .leaflet-control-zoom {
            border: none !important;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5) !important;
            margin-right: 16px !important;
            margin-bottom: 24px !important;
        }
        .leaflet-control-zoom a {
            background: rgba(15, 23, 42, 0.88) !important;
            color: #38bdf8 !important;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.12) !important;
            width: 38px !important;
            height: 38px !important;
            line-height: 38px !important;
            border-radius: 12px !important;
            margin-bottom: 6px;
            font-weight: bold;
            transition: all 0.25s ease;
        }
        .leaflet-control-zoom a:hover {
            background: #0284c7 !important;
            color: #ffffff !important;
            border-color: #38bdf8 !important;
        }

        /* Glassmorphism Styles */
        .glass-panel {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .glass-card {
            background: rgba(30, 41, 59, 0.75);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* Custom Illustrated SVG Markers */
        .geo-marker-wrapper {
            position: relative;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .geo-marker-pin {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
            border: 2px solid #ffffff;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease;
        }

        .geo-marker-wrapper:hover .geo-marker-pin {
            transform: scale(1.25) translateY(-4px);
            box-shadow: 0 12px 28px rgba(56, 189, 248, 0.6);
            z-index: 999;
        }

        /* Category specific pin gradients */
        .pin-mountain {
            background: linear-gradient(135deg, #d97706, #78350f, #451a03);
            border-color: #fef3c7;
        }
        .pin-ocean {
            background: linear-gradient(135deg, #0284c7, #0369a1, #0f172a);
            border-color: #bae6fd;
        }
        .pin-city {
            background: linear-gradient(135deg, #10b981, #047857, #064e3b);
            border-color: #a7f3d0;
        }

        .pulse-beacon {
            position: absolute;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            animation: pulseWave 2s infinite ease-out;
            pointer-events: none;
            opacity: 0;
        }

        .beacon-mountain { border: 2px solid #f59e0b; }
        .beacon-ocean { border: 2px solid #38bdf8; }
        .beacon-city { border: 2px solid #10b981; }

        @keyframes pulseWave {
            0% { transform: scale(0.6); opacity: 0.9; }
            100% { transform: scale(1.6); opacity: 0; }
        }

        /* Lightbox Overlay */
        #imageLightbox {
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 flex flex-col h-full select-none">

    <!-- Top Navigation & Controls Bar -->
    <header class="fixed top-3 left-3 right-3 md:top-4 md:left-4 md:right-4 z-[1000] pointer-events-none">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-stretch md:items-center justify-between gap-3">
            
            <!-- Logo & Brand Header -->
            <div class="pointer-events-auto glass-panel rounded-2xl px-4 py-2.5 flex items-center justify-between shadow-2xl border-cyan-500/20">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-500 via-sky-600 to-amber-600 flex items-center justify-center text-slate-950 font-bold text-xl shadow-lg shadow-cyan-500/30">
                        <i class="fa-solid fa-mountain-sun"></i>
                    </div>
                    <div>
                        <h1 class="font-bold text-lg leading-tight tracking-wide bg-gradient-to-r from-sky-400 via-teal-200 to-amber-300 bg-clip-text text-transparent">
                            বিশ্ব মানচিত্র অভিযাত্রী
                        </h1>
                        <p class="text-[11px] text-sky-200/80 font-medium flex items-center gap-1.5">
                            <span>🏔️ পাহাড়</span> • <span>🌊 সমুদ্র</span> • <span>🏙️ শহর</span>
                        </p>
                    </div>
                </div>

                <!-- Toggle Sidebar Mobile Button -->
                <button id="toggleSidebarMobile" class="md:hidden w-9 h-9 flex items-center justify-center bg-slate-800/80 hover:bg-slate-700 text-sky-300 rounded-xl border border-slate-700 transition">
                    <i class="fa-solid fa-bars text-sm"></i>
                </button>
            </div>

            <!-- Search Bar & Auto-Suggest -->
            <div class="pointer-events-auto relative flex-1 max-w-xl">
                <div class="relative glass-panel rounded-2xl shadow-2xl flex items-center p-1.5 border border-sky-500/30 focus-within:border-sky-400 transition-all duration-300">
                    <i class="fa-solid fa-magnifying-glass-location text-sky-400 text-base ml-3.5 mr-2"></i>
                    <input type="text" id="searchInput" 
                           placeholder="পাহাড়, সমুদ্র বা শহর খুঁজুন (যেমন: এভারেস্ট, কক্সবাজার, আল্পস, টোকিও)..." 
                           class="w-full bg-transparent text-slate-100 placeholder-slate-400 text-sm focus:outline-none px-2 py-1.5 font-medium"
                           autocomplete="off">
                    <button id="clearSearch" class="hidden text-slate-400 hover:text-slate-200 px-2 py-1">
                        <i class="fa-solid fa-xmark text-sm"></i>
                    </button>
                    <button id="searchBtn" class="bg-gradient-to-r from-sky-600 to-cyan-600 hover:from-sky-500 hover:to-cyan-500 text-white text-xs px-4 py-2 rounded-xl font-semibold transition flex items-center gap-1.5 shadow-md shadow-sky-600/30">
                        <span>খুঁজুন</span>
                        <i class="fa-solid fa-arrow-right text-[11px]"></i>
                    </button>
                </div>

                <!-- Search Suggestions Dropdown -->
                <div id="searchResults" class="absolute top-full left-0 right-0 mt-2 glass-panel rounded-2xl shadow-2xl overflow-hidden hidden max-h-80 overflow-y-auto z-50 divide-y divide-slate-800 border border-sky-500/30">
                    <!-- Dynamic Search Results Populated Here -->
                </div>
            </div>

            <!-- Action Tools & Layer Toggles (Desktop) -->
            <div class="pointer-events-auto hidden md:flex items-center gap-2">
                <!-- Map Layer Picker Dropdown -->
                <div class="relative group">
                    <button class="glass-panel px-3.5 py-2.5 rounded-2xl text-slate-200 hover:text-white text-xs font-semibold flex items-center gap-2 shadow-lg border border-sky-500/30 transition">
                        <i class="fa-solid fa-layer-group text-sky-400"></i>
                        <span id="currentLayerLabel">পাহাড় ও সমুদ্র (Relief)</span>
                        <i class="fa-solid fa-chevron-down text-[10px] text-slate-400"></i>
                    </button>

                    <!-- Dropdown Options -->
                    <div class="absolute right-0 top-full mt-2 w-56 glass-panel rounded-2xl shadow-2xl overflow-hidden hidden group-hover:block p-1.5 border border-sky-500/30 z-50">
                        <button onclick="changeTileLayer('physical')" class="w-full text-left px-3 py-2 rounded-xl text-xs font-medium text-slate-300 hover:bg-slate-800/80 hover:text-sky-300 flex items-center gap-2 transition">
                            <i class="fa-solid fa-mountain text-amber-400"></i> 🏔️ পাহাড় ও সমুদ্র (Relief)
                        </button>
                        <button onclick="changeTileLayer('opentopo')" class="w-full text-left px-3 py-2 rounded-xl text-xs font-medium text-slate-300 hover:bg-slate-800/80 hover:text-sky-300 flex items-center gap-2 transition">
                            <i class="fa-solid fa-route text-emerald-400"></i> 🧗 টপোগ্রাফিক সমরেখা
                        </button>
                        <button onclick="changeTileLayer('satellite')" class="w-full text-left px-3 py-2 rounded-xl text-xs font-medium text-slate-300 hover:bg-slate-800/80 hover:text-sky-300 flex items-center gap-2 transition">
                            <i class="fa-solid fa-satellite text-cyan-400"></i> 🛰️ ৩ডি স্যাটেলাইট ভিউ
                        </button>
                        <button onclick="changeTileLayer('voyager')" class="w-full text-left px-3 py-2 rounded-xl text-xs font-medium text-slate-300 hover:bg-slate-800/80 hover:text-sky-300 flex items-center gap-2 transition">
                            <i class="fa-solid fa-map-location-dot text-indigo-400"></i> 🎨 আর্ট ম্যাপ (Voyager)
                        </button>
                    </div>
                </div>

                <!-- My Location Button -->
                <button onclick="locateUser()" class="glass-panel p-2.5 rounded-2xl text-slate-200 hover:text-sky-400 hover:border-sky-500/50 shadow-lg border border-sky-500/30 transition" title="আমার অবস্থান">
                    <i class="fa-solid fa-crosshairs text-base"></i>
                </button>

                <!-- Reset World View Button -->
                <button onclick="resetWorldView()" class="glass-panel p-2.5 rounded-2xl text-slate-200 hover:text-sky-400 hover:border-sky-500/50 shadow-lg border border-sky-500/30 transition" title="বিশ্ব মানচিত্র দৃশ্য">
                    <i class="fa-solid fa-globe text-base"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Filter Category Pills & Fast Jump Bar -->
    <div class="fixed top-24 left-3 right-3 md:top-20 md:left-6 md:right-6 z-[990] pointer-events-none">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-start md:items-center justify-between gap-2">
            
            <!-- Category Filter Buttons -->
            <div class="pointer-events-auto flex items-center gap-1.5 p-1 glass-panel rounded-2xl border border-sky-500/20 shadow-xl overflow-x-auto scrollbar-none">
                <button onclick="filterCategory('all')" id="btnFilterAll" class="filter-btn active px-3 py-1 rounded-xl text-xs font-bold transition bg-sky-600 text-white flex items-center gap-1">
                    <i class="fa-solid fa-border-all"></i> সবগুলো
                </button>
                <button onclick="filterCategory('mountain')" id="btnFilterMountain" class="filter-btn px-3 py-1 rounded-xl text-xs font-bold transition text-slate-300 hover:text-amber-300 hover:bg-slate-800 flex items-center gap-1">
                    <span>🏔️</span> পাহাড় ও পর্বত
                </button>
                <button onclick="filterCategory('ocean')" id="btnFilterOcean" class="filter-btn px-3 py-1 rounded-xl text-xs font-bold transition text-slate-300 hover:text-sky-300 hover:bg-slate-800 flex items-center gap-1">
                    <span>🌊</span> সমুদ্র ও জলভাগ
                </button>
                <button onclick="filterCategory('city')" id="btnFilterCity" class="filter-btn px-3 py-1 rounded-xl text-xs font-bold transition text-slate-300 hover:text-emerald-300 hover:bg-slate-800 flex items-center gap-1">
                    <span>🏙️</span> শহর ও ঐতিহ্য
                </button>
            </div>

            <!-- Fast Jump Pills Pills -->
            <div id="quickPillsScroll" class="pointer-events-auto flex items-center gap-1.5 overflow-x-auto max-w-full py-0.5 scrollbar-none">
                <!-- Dynamic Jump Pills Inserted via JavaScript -->
            </div>
        </div>
    </div>

    <!-- Main Map Display -->
    <main class="flex-1 relative w-full h-full">
        <div id="map"></div>
    </main>

    <!-- Floating HUD (Coordinates, Zoom & Terrain Zone Indicator) -->
    <div class="fixed bottom-4 left-4 z-[990] pointer-events-auto hidden sm:flex items-center gap-3 glass-panel px-4 py-2.5 rounded-2xl border border-sky-500/30 text-xs text-slate-200 shadow-2xl backdrop-blur-md">
        <div class="flex items-center gap-1.5">
            <i class="fa-solid fa-compass text-sky-400"></i>
            <span id="hudCoords">২৩.৬৮৫০, ৯০.৩৫৬৩</span>
        </div>
        <div class="h-3.5 w-px bg-slate-700"></div>
        <div class="flex items-center gap-1.5">
            <i class="fa-solid fa-magnifying-glass-plus text-amber-400"></i>
            <span id="hudZoom">জুম: ৪</span>
        </div>
        <div class="h-3.5 w-px bg-slate-700"></div>
        <div class="flex items-center gap-1.5">
            <i class="fa-solid fa-water text-cyan-400"></i>
            <span id="hudZone" class="text-sky-300 font-semibold">ভৌগোলিক অঞ্চল: বঙ্গোপসাগর অববাহিকা</span>
        </div>
    </div>

    <!-- Sidebar Drawer for Mobile & Selected Info Card -->
    <aside id="infoSidebar" class="fixed bottom-0 left-0 right-0 md:top-24 md:bottom-auto md:right-6 md:left-auto md:w-96 z-[1000] glass-panel rounded-t-3xl md:rounded-3xl border border-sky-500/30 shadow-2xl transition-all duration-300 transform translate-y-full md:translate-y-0 hidden md:block max-h-[85vh] overflow-y-auto">
        <div class="p-4">
            <!-- Header -->
            <div class="flex items-center justify-between pb-3 border-b border-slate-800">
                <div class="flex items-center gap-2">
                    <span id="sidebarIcon" class="text-xl">🏔️</span>
                    <div>
                        <h3 id="sidebarTitle" class="font-bold text-slate-100 text-base leading-snug">স্থান সম্পর্কিত তথ্য</h3>
                        <p id="sidebarSubtitle" class="text-[11px] text-sky-300 font-medium"></p>
                    </div>
                </div>
                <button onclick="closeSidebar()" class="text-slate-400 hover:text-slate-100 p-1 rounded-lg">
                    <i class="fa-solid fa-xmark text-base"></i>
                </button>
            </div>

            <!-- Content Body Container -->
            <div id="sidebarBody" class="mt-3 space-y-3 text-xs text-slate-300">
                <p class="text-slate-400 text-center py-6">মানচিত্রে কোনো পর্বত, সমুদ্র বা শহরে ক্লিক করুন।</p>
            </div>
        </div>
    </aside>

    <!-- Fullscreen Lightbox Modal for Photo Gallery -->
    <div id="imageLightbox" class="fixed inset-0 z-[3000] bg-slate-950/95 backdrop-blur-xl flex flex-col items-center justify-center p-4 opacity-0 pointer-events-none">
        <button onclick="closeLightbox()" class="absolute top-6 right-6 text-slate-300 hover:text-white text-2xl w-12 h-12 rounded-full glass-panel flex items-center justify-center border border-slate-700 transition">
            <i class="fa-solid fa-xmark"></i>
        </button>
        <div class="max-w-4xl max-h-[80vh] flex flex-col items-center">
            <img id="lightboxImg" src="" alt="Full view" class="max-w-full max-h-[70vh] rounded-2xl object-contain border border-slate-700 shadow-2xl">
            <p id="lightboxCaption" class="mt-3 text-sm text-sky-200 font-medium text-center bg-slate-900/80 px-4 py-2 rounded-xl border border-slate-800"></p>
        </div>
    </div>

    <!-- Toast Notification Overlay -->
    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-[2000] glass-panel border border-sky-500/40 text-sky-200 px-4 py-2.5 rounded-2xl shadow-2xl text-xs font-semibold flex items-center gap-2 transition-all duration-300 opacity-0 pointer-events-none transform translate-y-4">
        <i class="fa-solid fa-circle-check text-sky-400 text-sm"></i>
        <span id="toastMsg">বার্তা প্রদর্শন করা হচ্ছে</span>
    </div>

    <!-- JavaScript Application Logic -->

        // --- 2. MAP TILE LAYERS & GROUPS ---
        const ESRI_PHYSICAL = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Physical_Map/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Esri, USGS, NOAA',
            maxZoom: 18
        });

        const ESRI_LABELS = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Esri',
            maxZoom: 18
        });

        const OPEN_TOPO = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenTopoMap',
            maxZoom: 17
        });

        const ESRI_SATELLITE = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Esri',
            maxZoom: 19
        });

        const CARTO_VOYAGER = L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
            attribution: 'CARTO',
            maxZoom: 19
        });

        // Layer Groups for composite maps
        const MAP_LAYERS = {
            physical: L.layerGroup([ESRI_PHYSICAL, ESRI_LABELS]),
            opentopo: L.layerGroup([OPEN_TOPO]),
            satellite: L.layerGroup([ESRI_SATELLITE, ESRI_LABELS]),
            voyager: L.layerGroup([CARTO_VOYAGER])
        };

        let map;
        let currentActiveLayer = MAP_LAYERS.physical;
        let markersGroup;
        let customSearchMarker = null;
        let activeCategoryFilter = 'all';

        // --- 3. APP INITIALIZATION ---
        window.addEventListener('DOMContentLoaded', () => {
            // Initialize Map centered on Bangladesh & Bay of Bengal
            map = L.map('map', {
                center: [23.6850, 90.3563],
                zoom: 5,
                minZoom: 2,
                maxZoom: 18,
                zoomControl: false
            });

            // Add default Terrain/Relief layer
            currentActiveLayer.addTo(map);

            // Add Custom Zoom Control
            L.control.zoom({ position: 'bottomright' }).addTo(map);

            // Markers layer group
            markersGroup = L.layerGroup().addTo(map);

            // Initial Render of Fast Jump Pills & Markers
            renderQuickPills();
            renderPlaceMarkers();

            // Setup Event Handlers
            setupMapListeners();
            setupSearchEngine();
        });

        // --- 4. RENDER JUMP PILLS ---
        function renderQuickPills() {
            const container = document.getElementById('quickPillsScroll');
            const filteredPlaces = activeCategoryFilter === 'all' 
                ? WORLD_PLACES 
                : WORLD_PLACES.filter(p => p.category === activeCategoryFilter);

            container.innerHTML = filteredPlaces.map(p => {
                const icon = p.category === 'mountain' ? '🏔️' : (p.category === 'ocean' ? '🌊' : '🏙️');
                return `
                    <button onclick="flyToPlace('${p.id}')" 
                            class="glass-panel text-slate-200 hover:text-sky-300 hover:border-sky-500/60 px-3 py-1 rounded-xl text-xs font-medium shrink-0 transition flex items-center gap-1.5 shadow-md">
                        <span>${icon}</span>
                        <span>${p.name}</span>
                    </button>
                `;
            }).join('');
        }

        // --- 5. RENDER ILLUSTRATED SVG MARKERS ---
        function renderPlaceMarkers() {
            markersGroup.clearLayers();

            const visiblePlaces = activeCategoryFilter === 'all' 
                ? WORLD_PLACES 
                : WORLD_PLACES.filter(p => p.category === activeCategoryFilter);

            visiblePlaces.forEach(place => {
                let iconSymbol = '';
                let pinClass = '';
                let beaconClass = '';

                if (place.category === 'mountain') {
                    iconSymbol = '<i class="fa-solid fa-mountain text-amber-300 text-sm"></i>';
                    pinClass = 'pin-mountain';
                    beaconClass = 'beacon-mountain';
                } else if (place.category === 'ocean') {
                    iconSymbol = '<i class="fa-solid fa-water text-cyan-200 text-sm"></i>';
                    pinClass = 'pin-ocean';
                    beaconClass = 'beacon-ocean';
                } else {
                    iconSymbol = '<i class="fa-solid fa-building text-emerald-200 text-sm"></i>';
                    pinClass = 'pin-city';
                    beaconClass = 'beacon-city';
                }

                const markerHtml = `
                    <div class="geo-marker-wrapper">
                        <div class="pulse-beacon ${beaconClass}"></div>
                        <div class="geo-marker-pin ${pinClass}">
                            ${iconSymbol}
                        </div>
                    </div>
                `;

                const customIcon = L.divIcon({
                    html: markerHtml,
                    className: '',
                    iconSize: [44, 44],
                    iconAnchor: [22, 22],
                    popupAnchor: [0, -22]
                });

                const marker = L.marker([place.lat, place.lng], { icon: customIcon });

                // Construct Interactive Popup
                const popupContent = `
                    <div class="p-4 w-72 text-slate-100 font-sans">
                        <div class="flex items-center justify-between pb-2 border-b border-slate-700/80 mb-3">
                            <div>
                                <h4 class="font-bold text-base text-sky-300 leading-tight">${place.name}</h4>
                                <p class="text-[11px] text-slate-400 font-medium">${place.enName} • ${place.country}</p>
                            </div>
                            <span class="px-2.5 py-1 rounded-lg text-[10px] font-bold ${
                                place.category === 'mountain' ? 'bg-amber-500/20 text-amber-300 border border-amber-500/40' :
                                (place.category === 'ocean' ? 'bg-sky-500/20 text-sky-300 border border-sky-500/40' :
                                'bg-emerald-500/20 text-emerald-300 border border-emerald-500/40')
                            }">
                                ${place.category === 'mountain' ? '🏔️ পর্বত' : (place.category === 'ocean' ? '🌊 সমুদ্র' : '🏙️ শহর')}
                            </span>
                        </div>

                        <div class="space-y-2 text-xs">
                            ${place.elevation ? `
                                <div class="flex items-center justify-between bg-slate-900/80 p-2 rounded-xl border border-slate-800">
                                    <span class="text-slate-400"><i class="fa-solid fa-mountain text-amber-400 mr-1"></i>উচ্চতা:</span>
                                    <span class="font-bold text-amber-200">${place.elevation}</span>
                                </div>
                            ` : ''}

                            ${place.depth ? `
                                <div class="flex items-center justify-between bg-slate-900/80 p-2 rounded-xl border border-slate-800">
                                    <span class="text-slate-400"><i class="fa-solid fa-water text-cyan-400 mr-1"></i>গভীরতা:</span>
                                    <span class="font-bold text-cyan-200">${place.depth}</span>
                                </div>
                            ` : ''}

                            ${place.pop ? `
                                <div class="flex items-center justify-between bg-slate-900/80 p-2 rounded-xl border border-slate-800">
                                    <span class="text-slate-400"><i class="fa-solid fa-users text-emerald-400 mr-1"></i>জনসংখ্যা:</span>
                                    <span class="font-bold text-emerald-200">${place.pop}</span>
                                </div>
                            ` : ''}

                            <p class="text-slate-300 text-[11px] leading-relaxed pt-1">${place.desc}</p>

                            <!-- Mini Photo Preview -->
                            ${place.photos && place.photos.length > 0 ? `
                                <div class="pt-2">
                                    <img src="${place.photos[0].url}" 
                                         alt="${place.name}" 
                                         onclick="openLightbox('${place.photos[0].url}', '${place.photos[0].caption}')"
                                         class="w-full h-28 object-cover rounded-xl border border-slate-700 cursor-pointer hover:opacity-90 transition">
                                </div>
                            ` : ''}
                        </div>

                        <div class="mt-3.5 pt-2 flex items-center justify-between gap-2">
                            <button onclick="flyToPlace('${place.id}')" class="w-full bg-gradient-to-r from-sky-600 to-cyan-600 hover:from-sky-500 hover:to-cyan-500 text-white font-semibold py-1.5 rounded-xl text-xs transition flex items-center justify-center gap-1.5">
                                <i class="fa-solid fa-magnifying-glass-plus text-[10px]"></i> জুম করে বিস্তারিত দেখুন
                            </button>
                        </div>
                    </div>
                `;

                marker.bindPopup(popupContent);

                marker.on('click', () => {
                    updateSidebarWithPlace(place);
                });

                markersGroup.addLayer(marker);
            });
        }

        // --- 6. CATEGORY FILTERING ---
        function filterCategory(cat) {
            activeCategoryFilter = cat;

            // Update UI Button states
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('bg-sky-600', 'text-white');
                btn.classList.add('text-slate-300');
            });

            const activeBtnMap = {
                'all': 'btnFilterAll',
                'mountain': 'btnFilterMountain',
                'ocean': 'btnFilterOcean',
                'city': 'btnFilterCity'
            };

            const activeBtn = document.getElementById(activeBtnMap[cat]);
            if (activeBtn) {
                activeBtn.classList.add('bg-sky-600', 'text-white');
                activeBtn.classList.remove('text-slate-300');
            }

            renderQuickPills();
            renderPlaceMarkers();
            showToast(`ফিল্টার করা হয়েছে: ${cat === 'all' ? 'সবগুলো' : (cat === 'mountain' ? 'পাহাড় ও পর্বত' : (cat === 'ocean' ? 'সমুদ্র ও জলভাগ' : 'শহর'))}`);
        }

        // --- 7. FLY TO PLACE ---
        function flyToPlace(id) {
            const place = WORLD_PLACES.find(p => p.id === id);
            if (place) {
                map.flyTo([place.lat, place.lng], place.zoom || 11, {
                    duration: 2.2,
                    easeLinearity: 0.25
                });

                markersGroup.eachLayer(layer => {
                    const latLng = layer.getLatLng();
                    if (Math.abs(latLng.lat - place.lat) < 0.01 && Math.abs(latLng.lng - place.lng) < 0.01) {
                        setTimeout(() => layer.openPopup(), 2300);
                    }
                });

                updateSidebarWithPlace(place);
                showToast(`জুম করা হচ্ছে: ${place.name}`);
            }
        }

        // --- 8. UPDATE SIDEBAR DRAWER & GALLERY ---
        function updateSidebarWithPlace(place) {
            const sidebar = document.getElementById('infoSidebar');
            const title = document.getElementById('sidebarTitle');
            const subtitle = document.getElementById('sidebarSubtitle');
            const icon = document.getElementById('sidebarIcon');
            const body = document.getElementById('sidebarBody');

            sidebar.classList.remove('hidden', 'translate-y-full');
            
            icon.innerText = place.category === 'mountain' ? '🏔️' : (place.category === 'ocean' ? '🌊' : '🏙️');
            title.innerText = place.name;
            subtitle.innerText = place.enName + " • " + place.country;

                                    <img src="${photo.url}" alt="${photo.caption}" class="w-full h-24 object-cover group-hover:scale-110 transition duration-300">

                                    </div>
                                </div>

            body.innerHTML = `
                <div class="space-y-3">
                    <div class="bg-slate-900/80 p-3 rounded-2xl border border-slate-800 space-y-2">
                        ${place.elevation ? `
                            <div class="flex justify-between">
                                <span class="text-slate-400">সর্বোচ্চ উচ্চতা:</span>
                                <span class="font-bold text-amber-300">${place.elevation}</span>
                            </div>
                            <div class="flex justify-between">
                                <span class="text-slate-400">পর্বতমালা / শ্রেণী:</span>
                                <span class="font-medium text-slate-200">${place.range}</span>
                            </div>

                        ${place.depth ? `
                            <div class="flex justify-between">
                                <span class="text-slate-400">সর্বোচ্চ গভীরতা:</span>
                                <span class="font-bold text-cyan-300">${place.depth}</span>

                        <div class="flex justify-between">

                            class="w-full bg-slate-800 hover:bg-slate-700 text-sky-300 border border-sky-500/30 font-semibold py-2 rounded-xl text-xs transition flex items-center justify-center gap-1.5 mt-2">
                        <i class="fa-solid fa-earth-americas"></i> আরও কাছে থেকে পর্যবেক্ষণ করুন

            setTimeout(() => sidebar.classList.add('hidden'), 300);
        }

        // --- 9. LIGHTBOX PHOTO VIEWER ---
        function openLightbox(url, caption) {
            const lightbox = document.getElementById('imageLightbox');
            const img = document.getElementById('lightboxImg');
            const cap = document.getElementById('lightboxCaption');

            img.src = url;
            cap.innerText = caption || '';
            lightbox.classList.remove('opacity-0', 'pointer-events-none');
        }

        function closeLightbox() {
            const lightbox = document.getElementById('imageLightbox');
            lightbox.classList.add('opacity-0', 'pointer-events-none');
        }

        // --- 10. MAP LAYER SWITCHER ---
        function changeTileLayer(layerKey) {
            if (MAP_LAYERS[layerKey]) {
                map.removeLayer(currentActiveLayer);
                currentActiveLayer = MAP_LAYERS[layerKey];
                currentActiveLayer.addTo(map);

                const labels = {
                    physical: 'পাহাড় ও সমুদ্র (Relief)',
                    opentopo: 'টপোগ্রাফিক সমরেখা',
                    satellite: '৩ডি স্যাটেলাইট ভিউ',
                    voyager: 'আর্ট ম্যাপ (Voyager)'
                };
                document.getElementById('currentLayerLabel').innerText = labels[layerKey];
                showToast(`ম্যাপ মোড: ${labels[layerKey]}`);
            }
        }

        // --- 11. MAP LISTENERS & ZONE INDICATOR ---
        function setupMapListeners() {
            map.on('mousemove', (e) => {
                const { lat, lng } = e.latlng;
                document.getElementById('hudCoords').innerText = `${lat.toFixed(4)}, ${lng.toFixed(4)}`;

                // Simple Geographic Zone Detection based on Lat/Lng
                let zoneText = "মহাদেশীয় এলাকা";
                if (lat >= 20 && lat <= 28 && lng >= 85 && lng <= 95) {
                    zoneText = "হিমালয় ও বঙ্গোপসাগর অববাহিকা";
                } else if (lat < 15 && lat > -15 && lng > 60 && lng < 100) {
                    zoneText = "ভারত মহাসাগর জলভাগ";
                } else if (lat > 20 && lat < 50 && lng < -30) {
                    zoneText = "উত্তর আটলান্টিক মহাসাগর";
                } else if (lat > 25 && lat < 45 && lng > 70 && lng < 100) {
                    zoneText = "উচ্চ হিমালয় পর্বতমালা";
                }
                document.getElementById('hudZone').innerText = `অঞ্চল: ${zoneText}`;
            });

            map.on('zoomend', () => {
                document.getElementById('hudZoom').innerText = `জুম: ${map.getZoom()}`;
            });

            map.on('click', async (e) => {
                const { lat, lng } = e.latlng;
                
                if (customSearchMarker) map.removeLayer(customSearchMarker);

                customSearchMarker = L.marker([lat, lng]).addTo(map);
                customSearchMarker.bindPopup(`
                    <div class="p-3 text-center text-slate-200">
                        <i class="fa-solid fa-spinner fa-spin text-sky-400 text-lg mb-1"></i>
                        <p class="text-xs">ভৌগোলিক তথ্য খোঁজা হচ্ছে...</p>
                    </div>
                `).openPopup();

                try {
                    const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&accept-language=bn,en`);
                    const data = await res.json();
                    
                    if (data && data.display_name) {
                        const placeTitle = data.address.natural || data.address.mountain || data.address.water || data.address.city || data.address.country || "চিহ্নিত স্থানাঙ্ক";

                        customSearchMarker.setPopupContent(`
                            <div class="p-3 w-64 text-slate-100 font-sans">
                                <h4 class="font-bold text-sm text-sky-400 mb-1"><i class="fa-solid fa-location-dot mr-1"></i>${placeTitle}</h4>
                                <p class="text-[11px] text-slate-300 leading-normal mb-2">${data.display_name}</p>
                                <div class="text-[10px] text-slate-400 font-mono bg-slate-900 p-1.5 rounded-lg text-center border border-slate-800">
                                    অক্ষরেখা: ${lat.toFixed(4)} | দ্রাঘিমা: ${lng.toFixed(4)}
                                </div>
                            </div>
                        `);
                    }
                } catch (err) {
                    customSearchMarker.setPopupContent(`
                        <div class="p-2 text-xs text-slate-200">
                            <strong>স্থানাঙ্ক:</strong> ${lat.toFixed(4)}, ${lng.toFixed(4)}
                        </div>
                    `);
                }
            });
        }

        // --- 12. SEARCH ENGINE ---
        function setupSearchEngine() {
            const searchInput = document.getElementById('searchInput');
            const searchBtn = document.getElementById('searchBtn');
            const searchResults = document.getElementById('searchResults');
            const clearSearch = document.getElementById('clearSearch');

            let debounceTimer;

            searchInput.addEventListener('input', (e) => {
                const query = e.target.value.trim();

                if (query.length > 0) {
                    clearSearch.classList.remove('hidden');
                } else {
                    clearSearch.classList.add('hidden');
                    searchResults.classList.add('hidden');
                    return;
                }

                clearTimeout(debounceTimer);
                debounceTimer = setTimeout(() => {
                    performSearch(query);
                }, 350);
            });

            clearSearch.addEventListener('click', () => {
                searchInput.value = '';
                clearSearch.classList.add('hidden');
                searchResults.classList.add('hidden');
            });

            searchBtn.addEventListener('click', () => {
                const query = searchInput.value.trim();
                if (query) performSearch(query, true);
            });
        }

        async function performSearch(query, directJump = false) {
            const searchResults = document.getElementById('searchResults');
            
            // Filter local database
            const localMatches = WORLD_PLACES.filter(p => 
                p.name.toLowerCase().includes(query.toLowerCase()) || 
                p.enName.toLowerCase().includes(query.toLowerCase()) ||
                p.country.toLowerCase().includes(query.toLowerCase())
            );

            if (directJump && localMatches.length > 0) {
                flyToPlace(localMatches[0].id);
                searchResults.classList.add('hidden');
                return;
            }

            // Nominatim API Search
            try {
                const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=5&accept-language=bn,en`);
                const apiResults = await response.json();

                renderSearchResults(localMatches, apiResults, query, directJump);
            } catch (err) {
                renderSearchResults(localMatches, [], query, directJump);
            }
        }

        function renderSearchResults(localMatches, apiResults, query, directJump) {
            const searchResults = document.getElementById('searchResults');
            
            if (localMatches.length === 0 && apiResults.length === 0) {
                searchResults.innerHTML = `
                    <div class="p-4 text-center text-xs text-slate-400">
                        "${query}" দিয়ে কোন স্থান পাওয়া যায়নি।
                    </div>
                `;
                searchResults.classList.remove('hidden');
                return;
            }

            if (directJump && apiResults.length > 0) {
                const topRes = apiResults[0];
                jumpToCoords(parseFloat(topRes.lat), parseFloat(topRes.lon), topRes.display_name);
                searchResults.classList.add('hidden');
                return;
            }

            let html = '';

            if (localMatches.length > 0) {
                html += `<div class="px-3 py-1.5 text-[10px] font-bold text-amber-400 uppercase bg-slate-900/80 tracking-wider">প্রধান পাহাড়, সমুদ্র ও স্থান</div>`;
                localMatches.forEach(p => {
                    const icon = p.category === 'mountain' ? '🏔️' : (p.category === 'ocean' ? '🌊' : '🏙️');
                    html += `
                        <div onclick="flyToPlace('${p.id}'); document.getElementById('searchResults').classList.add('hidden');" 
                             class="px-4 py-2.5 hover:bg-slate-800/80 cursor-pointer flex items-center justify-between transition border-b border-slate-800/50">
                            <div class="flex items-center gap-2">
                                <span class="text-sm">${icon}</span>
                                <div>
                                    <span class="text-xs font-bold text-slate-100">${p.name}</span>
                                    <span class="text-[11px] text-slate-400"> (${p.enName})</span>
                                </div>
                            </div>
                            <span class="text-[10px] text-slate-400 bg-slate-800 px-2 py-0.5 rounded-md">${p.country}</span>
                        </div>
                    `;
                });
            }

            if (apiResults.length > 0) {
                html += `<div class="px-3 py-1.5 text-[10px] font-bold text-sky-400 uppercase bg-slate-900/80 tracking-wider">বিশ্ব মানচিত্র লাইভ ফলাফল</div>`;
                apiResults.forEach(item => {
                    html += `
                        <div onclick="jumpToCoords(${item.lat}, ${item.lon}, '${escapeQuotes(item.display_name)}'); document.getElementById('searchResults').classList.add('hidden');" 
                             class="px-4 py-2.5 hover:bg-slate-800/80 cursor-pointer flex items-start gap-2 transition">
                            <i class="fa-solid fa-location-dot text-sky-400 text-xs mt-1"></i>
                            <div class="text-xs text-slate-200 line-clamp-2">
                                ${item.display_name}
                            </div>
                        </div>
                    `;
                });
            }

            searchResults.innerHTML = html;
            searchResults.classList.remove('hidden');
        }

        function escapeQuotes(str) {
            return str.replace(/'/g, "\\'").replace(/"/g, '\\"');
        }

        function jumpToCoords(lat, lon, label) {
            map.flyTo([lat, lon], 12, { duration: 2 });

            if (customSearchMarker) map.removeLayer(customSearchMarker);

            customSearchMarker = L.marker([lat, lon]).addTo(map);
            customSearchMarker.bindPopup(`
                <div class="p-3 w-60 text-slate-100 font-sans">
                    <h4 class="font-bold text-xs text-sky-400 mb-1"><i class="fa-solid fa-magnifying-glass-location mr-1"></i>অনুসন্ধান ফলাফল</h4>
                    <p class="text-[11px] text-slate-300 leading-normal mb-1.5">${label}</p>
                    <div class="text-[10px] text-slate-400 font-mono bg-slate-900 p-1.5 rounded-lg text-center">
                        ${lat.toFixed(4)}, ${lon.toFixed(4)}
                    </div>
                </div>
            `).openPopup();

            showToast("নেভিগেট করা হচ্ছে...");
        }

        // --- 13. GEOLOCATION & UTILS ---
        function locateUser() {
            if (!navigator.geolocation) {
                showToast("অবস্থান সমর্থিত নয়");
                return;
            }
            showToast("আপনার অবস্থান খোঁজা হচ্ছে...");
            navigator.geolocation.getCurrentPosition((pos) => {
                const { latitude, longitude } = pos.coords;
                map.flyTo([latitude, longitude], 14, { duration: 2 });

                if (customSearchMarker) map.removeLayer(customSearchMarker);

                customSearchMarker = L.marker([latitude, longitude]).addTo(map);
                customSearchMarker.bindPopup(`
                    <div class="p-3 text-slate-100 font-sans text-center">
                        <i class="fa-solid fa-user-location text-sky-400 text-xl mb-1"></i>
                        <h4 class="font-bold text-xs text-sky-400">আপনার বর্তমান অবস্থান</h4>
                        <p class="text-[10px] text-slate-400 font-mono mt-1">${latitude.toFixed(4)}, ${longitude.toFixed(4)}</p>
                    </div>
                `).openPopup();
            });
        }

        function resetWorldView() {
            map.flyTo([23.6850, 90.3563], 4, { duration: 2 });
            showToast("বিশ্ব দৃশ্যে ফিরে আসা হয়েছে");
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');

            toastMsg.innerText = message;
            toast.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-4');

            setTimeout(() => {
                toast.classList.add('opacity-0', 'pointer-events-none', 'translate-y-4');
            }, 3000);
        }

        // Mobile Sidebar Listener
        document.getElementById('toggleSidebarMobile').addEventListener('click', () => {
            const sidebar = document.getElementById('infoSidebar');
            if (sidebar.classList.contains('hidden')) {
                sidebar.classList.remove('hidden', 'translate-y-full');
            } else {
                sidebar.classList.add('translate-y-full');
                setTimeout(() => sidebar.classList.add('hidden'), 300);
            }
        });
    </script>
</body>
</html>
